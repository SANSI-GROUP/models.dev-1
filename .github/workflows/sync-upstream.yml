name: Sync with Upstream

# Automatically sync this fork with the upstream repository
# Runs on a schedule and can be triggered manually

on:
  schedule:
    # Run every 6 hours to keep fork in sync
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev || true
          git fetch upstream

      - name: Sync dev branch
        run: |
          git checkout dev || git checkout -b dev
          git reset --hard upstream/dev
          git push --force origin dev

      - name: Sync other branches if needed
        run: |
          # Add additional branch syncing here if needed
          echo "Main dev branch synced successfully"

      - name: Trigger deployment workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // Try workflow_dispatch first
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'dev'
              });
              console.log('Deploy workflow triggered via workflow_dispatch');

              // Also send repository_dispatch as a backup
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'sync-completed'
              });
              console.log('Repository dispatch event sent');
            } catch (error) {
              console.error('Failed to trigger deploy workflow:', error);
              // Don't fail the sync if deploy trigger fails
            }
