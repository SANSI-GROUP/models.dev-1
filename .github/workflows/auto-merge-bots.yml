name: Auto Merge Bot PRs

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      !github.event.pull_request.draft &&
      contains(fromJSON('["copilot-swe-agent[bot]", "github-actions[bot]", "lightweight-agent[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI
        run: sleep 10

      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Auto-approved bot PR"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --auto \
            --squash
