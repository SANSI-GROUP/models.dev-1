name: Sync Merge Upstream
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream and merge
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch upstream
          git merge upstream/dev --no-edit -X theirs || {
            echo "Auto-merge with theirs strategy"
            git checkout --theirs .
            git add -A
            git commit --no-edit
          }
      - name: Push
        run: git push origin dev
