name: Agent Autofix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    if: github.event.label.name == 'agent-fix' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install lightweight CLI
        run: bun install -g --trust lightweight-ai

      - name: Seed Copilot auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << EOF
          {
            "github-copilot": {
              "type": "oauth",
              "refresh": "${{ secrets.COPILOT_OAUTH_TOKEN }}",
              "access": "${{ secrets.COPILOT_OAUTH_TOKEN }}",
              "expires": 0
            }
          }
          EOF
          chmod 600 ~/.local/share/opencode/auth.json

      - name: Prepare prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const prompt = [
              `Fix GitHub issue #${issue.number}: ${issue.title}`,
              ``,
              `## Description`,
              issue.body || 'No description provided.',
              ``,
              `## Instructions`,
              `- The default branch is "dev".`,
              `- This is a model registry project with TOML model configs in providers/<provider>/models/.`,
              `- Read the project structure before making changes.`,
              `- Make minimal, focused changes that fix only this issue.`,
              `- Preserve all existing model configurations and provider structures.`,
              `- If the issue is about a model config, validate TOML syntax.`,
              ``,
              `## After making changes`,
              `Write a concise summary of what you changed and why to /tmp/pr-summary.txt (plain text, 2-4 sentences).`,
            ].join('\n');
            fs.writeFileSync('/tmp/agent-prompt.txt', prompt);

      - name: Run agent
        run: |
          cat /tmp/agent-prompt.txt | lightweight run \
            --model github-copilot/claude-opus-4.6
        env:
          OPENCODE_MODELS_URL: https://templarsco.github.io/models.dev-1

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        id: body
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const issue = context.payload.issue;

            let summary = 'Automated fix generated by Lightweight Agent.';
            try {
              summary = fs.readFileSync('/tmp/pr-summary.txt', 'utf8').trim();
            } catch {}

            const diff = execSync('git diff --stat HEAD', { encoding: 'utf8' }).trim();

            const body = [
              `### Issue for this PR`,
              ``,
              `Closes #${issue.number}`,
              ``,
              `### Type of change`,
              ``,
              `- [x] Bug fix`,
              `- [ ] New feature`,
              `- [ ] Refactor / code improvement`,
              `- [ ] Documentation`,
              ``,
              `### What does this PR do?`,
              ``,
              summary,
              ``,
              `### Changed files`,
              ``,
              '```',
              diff,
              '```',
              ``,
              `### Checklist`,
              ``,
              `- [x] Changes are minimal and focused on the reported issue`,
              `- [x] No unrelated changes included`,
              ``,
              `---`,
              `*Generated by [Lightweight Agent](https://github.com/templarsco/lightweight) running in CI.*`,
            ].join('\n');

            return body;

      - name: Create pull request
        id: pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: agent-fix/issue-${{ github.event.issue.number }}
          base: dev
          title: "fix: resolve #${{ github.event.issue.number }}"
          body: ${{ steps.body.outputs.result }}
          commit-message: "fix: resolve #${{ github.event.issue.number }}"
          delete-branch: true
          labels: automated,needs-review

      - name: Assign reviewer on PR
        if: steps.changes.outputs.has_changes == 'true' && steps.pr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const pr = ${{ steps.pr.outputs.pull-request-number }};
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              reviewers: ['brunusansi']
            });

      - name: Comment on issue (success)
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '🤖 Agent created a pull request to fix this issue. Review incoming.'
            });

      - name: Flag for manual review
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['needs-review']
            });
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              assignees: ['brunusansi']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '🤖 Agent analyzed the issue but could not determine changes to make. Flagged for manual review.'
            });

      - name: Remove agent-fix label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'agent-fix'
              });
            } catch (e) {
              // Label already removed
            }
