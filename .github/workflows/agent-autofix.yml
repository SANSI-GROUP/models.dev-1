name: Agent Autofix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autofix:
    if: github.event.label.name == 'agent-fix' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-autofix-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Generate bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install lightweight CLI
        run: bun install -g --trust lightweight-ai

      - name: Seed Copilot auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << 'AUTHEOF'
          {
            "github-copilot": {
              "type": "oauth",
              "refresh": "${{ secrets.COPILOT_OAUTH_TOKEN }}",
              "access": "${{ secrets.COPILOT_OAUTH_TOKEN }}",
              "expires": 0
            }
          }
          AUTHEOF
          chmod 600 ~/.local/share/opencode/auth.json

      - name: Prepare prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const isSyncReview = issue.labels.some(l => l.name === 'sync-review');

            let prompt;
            if (isSyncReview) {
              prompt = [
                `Resolve upstream sync review issue #${issue.number}: ${issue.title}`,
                ``,
                `## Context`,
                issue.body || 'No description provided.',
                ``,
                `## Instructions`,
                `- The default branch is "dev".`,
                `- This is a model registry project. Models are TOML files in providers/<provider>/models/<model>.toml.`,
                `- An upstream sync just merged new changes. Your job is to VERIFY and FIX any issues.`,
                `- Read the issue body carefully — it lists specific files that changed and tasks to verify.`,
                ``,
                `## What to check and fix`,
                `1. Check if any custom models were overwritten or deleted by the sync. Custom models may have fields or configs that differ from upstream.`,
                `2. Check if any TOML files have syntax errors or invalid schema.`,
                `3. Check if any new provider directories are missing required structure.`,
                `4. If files were deleted that should exist, restore them from git history.`,
                `5. If no issues found, create a small documentation fix or comment — do NOT leave the repo unchanged.`,
                ``,
                `## Important`,
                `- Run \`find providers -name "*.toml" | head -30\` to see the project structure.`,
                `- Validate TOML syntax of any changed files.`,
                `- Make minimal, targeted fixes only.`,
                `- If everything looks correct after verification, add a comment to the TOML file that was most recently changed (e.g. # verified <date>).`,
                ``,
                `## After making changes`,
                `Write a concise summary of what you verified and changed to /tmp/pr-summary.txt (plain text, 2-4 sentences).`,
              ].join('\n');
            } else {
              prompt = [
                `Fix GitHub issue #${issue.number}: ${issue.title}`,
                ``,
                `## Description`,
                issue.body || 'No description provided.',
                ``,
                `## Instructions`,
                `- The default branch is "dev".`,
                `- This is a model registry project with TOML model configs in providers/<provider>/models/<model>.toml.`,
                `- Read the project structure before making changes.`,
                `- Make minimal, focused changes that fix only this issue.`,
                `- Preserve all existing model configurations and provider structures.`,
                `- If the issue is about a model config, validate TOML syntax.`,
                ``,
                `## After making changes`,
                `Write a concise summary of what you changed and why to /tmp/pr-summary.txt (plain text, 2-4 sentences).`,
              ].join('\n');
            }
            fs.writeFileSync('/tmp/agent-prompt.txt', prompt);

      - name: Run agent
        run: |
          cat /tmp/agent-prompt.txt | lightweight run \
            --model github-copilot/claude-opus-4.6
        env:
          OPENCODE_MODELS_URL: https://templarsco.github.io/models.dev-1

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        id: body
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const issue = context.payload.issue;

            let summary = 'Automated fix generated by Lightweight Agent.';
            try {
              summary = fs.readFileSync('/tmp/pr-summary.txt', 'utf8').trim();
            } catch {}

            const diff = execSync('git diff --stat HEAD', { encoding: 'utf8' }).trim();

            const body = [
              `### Issue for this PR`,
              ``,
              `Closes #${issue.number}`,
              ``,
              `### Type of change`,
              ``,
              `- [x] Bug fix`,
              `- [ ] New feature`,
              `- [ ] Refactor / code improvement`,
              `- [ ] Documentation`,
              ``,
              `### What does this PR do?`,
              ``,
              summary,
              ``,
              `### Changed files`,
              ``,
              '```',
              diff,
              '```',
              ``,
              `### Checklist`,
              ``,
              `- [x] Changes are minimal and focused on the reported issue`,
              `- [x] No unrelated changes included`,
              ``,
              `---`,
              `*Generated by [Lightweight Agent](https://github.com/templarsco/lightweight) running in CI.*`,
            ].join('\n');

            return body;

      - name: Create pull request
        id: pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: agent-fix/issue-${{ github.event.issue.number }}
          base: dev
          title: "fix: resolve #${{ github.event.issue.number }}"
          body: ${{ steps.body.outputs.result }}
          commit-message: "fix: resolve #${{ github.event.issue.number }}"
          delete-branch: true
          labels: automated,needs-review

      - name: Comment on issue (success)
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '\u{1F916} Agent created a pull request to fix this issue.'
            });

      - name: Flag for manual review
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '\u{1F916} Agent analyzed the issue but could not determine changes to make. Flagged for manual review.'
            });

      - name: Remove agent-fix label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'agent-fix'
              });
            } catch (e) {
              // Label already removed
            }
